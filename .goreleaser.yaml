version: 2

project_name: tlsferry

builds:
  - id: tlsferry
    main: ./cmd/tlsferry
    binary: tlsferry
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/nonozone/TLSFerry/internal/cli.version={{ .Version }}

archives:
  - id: tlsferry
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - config.example.json
      - config.release-smoke.example.json

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  prerelease: auto
