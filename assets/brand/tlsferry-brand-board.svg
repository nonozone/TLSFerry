<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">TLSFerry visual identity</title>
  <desc id="desc">Logo, color, typography, and interface examples for the TLSFerry brand.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#102A33" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#102A33" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#F7F3EA"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="72" y="74" fill="#5D6E73" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" letter-spacing="2.5">VISUAL SYSTEM / 01</text>
  <text x="1528" y="74" fill="#5D6E73" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="16">CE + CLOUD</text>

  <g transform="translate(72 116)" filter="url(#shadow)">
    <rect width="936" height="520" rx="18" fill="#102A33"/>
    <g transform="translate(58 52)">
      <path fill="#F7F3EA" d="m4 29 16 7v14H4Z"/>
      <path fill="#F7F3EA" d="m60 29-16 7v14h16Z"/>
      <path fill="#F7F3EA" fill-rule="evenodd" d="M20 31h24l-3 14-9 6-9-6Zm3 7 9 5 9-5-.8 3.5-8.2 4.8-8.2-4.8Z"/>
      <path fill="#E76F3C" d="m25 18 16-2-2 14-16 2Z"/>
    </g>
    <text x="142" y="100" fill="#F7F3EA" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.7">TLSFerry</text>
    <text x="58" y="232" fill="#F7F3EA" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">Certificates,</text>
    <text x="58" y="308" fill="#F7F3EA" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">safely delivered.</text>
    <text x="60" y="382" fill="#A9B7BA" font-family="IBM Plex Sans, Avenir Next, Arial, sans-serif" font-size="22">Issue once. Route deliberately. Renew without drama.</text>
    <g transform="translate(60 432)">
      <rect width="156" height="42" rx="6" fill="#E76F3C"/>
      <text x="78" y="27" fill="#102A33" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">DELIVER</text>
      <text x="184" y="27" fill="#D7DEE0" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="14">issuer  ─────  target</text>
    </g>
  </g>

  <g transform="translate(1040 116)" filter="url(#shadow)">
    <rect width="488" height="520" rx="18" fill="#FCFAF5"/>
    <text x="34" y="50" fill="#5D6E73" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" letter-spacing="1.5">ROUTE / ASSETS-EXAMPLE</text>
    <circle cx="432" cy="44" r="5" fill="#2F7A64"/>
    <text x="416" y="49" fill="#2F7A64" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">READY</text>
    <line x1="34" y1="76" x2="454" y2="76" stroke="#D7DEE0"/>

    <text x="34" y="118" fill="#102A33" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-.8">assets.example.com</text>
    <text x="34" y="150" fill="#5D6E73" font-family="IBM Plex Sans, Avenir Next, Arial, sans-serif" font-size="15">Wildcard certificate · renews in 11 days</text>

    <g transform="translate(34 198)">
      <circle cx="15" cy="15" r="15" fill="#102A33"/>
      <text x="15" y="20" fill="#FCFAF5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700">1</text>
      <text x="48" y="11" fill="#102A33" font-family="IBM Plex Sans, Avenir Next, Arial, sans-serif" font-size="14" font-weight="600">ISSUE</text>
      <text x="48" y="32" fill="#5D6E73" font-family="IBM Plex Mono, monospace" font-size="13">ACME · DNS-01</text>
      <line x1="15" y1="36" x2="15" y2="92" stroke="#BFCBCD" stroke-width="2"/>
      <circle cx="15" cy="113" r="15" fill="#102A33"/>
      <text x="15" y="118" fill="#FCFAF5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700">2</text>
      <text x="48" y="109" fill="#102A33" font-family="IBM Plex Sans, Avenir Next, Arial, sans-serif" font-size="14" font-weight="600">VERIFY</text>
      <text x="48" y="130" fill="#5D6E73" font-family="IBM Plex Mono, monospace" font-size="13">SAN · expiry · chain</text>
      <line x1="15" y1="134" x2="15" y2="190" stroke="#BFCBCD" stroke-width="2"/>
      <circle cx="15" cy="211" r="15" fill="#E76F3C"/>
      <text x="15" y="216" fill="#102A33" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700">3</text>
      <text x="48" y="207" fill="#102A33" font-family="IBM Plex Sans, Avenir Next, Arial, sans-serif" font-size="14" font-weight="600">DELIVER</text>
      <text x="48" y="228" fill="#5D6E73" font-family="IBM Plex Mono, monospace" font-size="13">Tencent CDN · 3 targets</text>
    </g>

    <rect x="34" y="458" width="420" height="40" rx="6" fill="#102A33"/>
    <text x="54" y="483" fill="#FCFAF5" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="13">tlsferry plan --config config.json</text>
  </g>

  <g transform="translate(72 690)">
    <text y="22" fill="#102A33" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700">Color</text>
    <g transform="translate(0 52)">
      <rect width="202" height="126" rx="10" fill="#102A33"/>
      <text x="18" y="92" fill="#F7F3EA" font-family="IBM Plex Sans, Avenir Next, Arial, sans-serif" font-size="15" font-weight="600">Harbor ink</text>
      <text x="18" y="113" fill="#A9B7BA" font-family="IBM Plex Mono, monospace" font-size="12">#102A33</text>
    </g>
    <g transform="translate(218 52)">
      <rect width="202" height="126" rx="10" fill="#E76F3C"/>
      <text x="18" y="92" fill="#102A33" font-family="IBM Plex Sans, Avenir Next, Arial, sans-serif" font-size="15" font-weight="600">Signal orange</text>
      <text x="18" y="113" fill="#672B17" font-family="IBM Plex Mono, monospace" font-size="12">#E76F3C</text>
    </g>
    <g transform="translate(436 52)">
      <rect width="202" height="126" rx="10" fill="#FCFAF5" stroke="#D7DEE0"/>
      <text x="18" y="92" fill="#102A33" font-family="IBM Plex Sans, Avenir Next, Arial, sans-serif" font-size="15" font-weight="600">Salt</text>
      <text x="18" y="113" fill="#5D6E73" font-family="IBM Plex Mono, monospace" font-size="12">#FCFAF5</text>
    </g>
  </g>

  <g transform="translate(782 690)">
    <text y="22" fill="#102A33" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700">Type</text>
    <text y="95" fill="#102A33" font-family="IBM Plex Sans, Avenir Next, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.5">Route with intent.</text>
    <text y="136" fill="#5D6E73" font-family="IBM Plex Sans, Avenir Next, Arial, sans-serif" font-size="19">IBM Plex Sans · interface and prose</text>
    <text y="178" fill="#102A33" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="16">SHA256  7D:4A:91:2F  ·  47d 06h</text>
  </g>

  <line x1="72" y1="936" x2="1528" y2="936" stroke="#BFCBCD"/>
  <text x="72" y="972" fill="#5D6E73" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="13">CALM INFRASTRUCTURE · EXPLICIT ROUTES · VISIBLE SAFETY</text>
  <text x="1528" y="972" fill="#5D6E73" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="13">TLSFERRY / 2026</text>
</svg>
